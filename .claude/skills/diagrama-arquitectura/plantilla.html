<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagrama de arquitectura</title>
<style>
/* Plantilla de diagrama de arquitectura (estilo AWS). Motor y datos van separados:
   los datos son el bloque JSON <script id="spec" type="application/json"> del final; el motor es el <script> que lo sigue.
   Para hacer un diagrama: copiar este archivo y reemplazar SOLO el bloque spec (ver SKILL.md).
   Vista «Arquitectura»: todo de un vistazo. Vista «Recorrido animado»: un paquete viaja por las flechas, paso a paso.
   Parámetros de URL: ?captura=1 (sin controles ni animación, para capturas), ?vista=arquitectura|recorrido,
   ?escenario=N y ?paso=K (desde 1, para el recorrido), ?tema=claro|oscuro.
   Sin dependencias externas: tipografías del sistema, un solo archivo. */
:root{
  --bg:#f3f6fa; --surface:#ffffff; --ink:#122033; --muted:#566a7f; --line:#d5dee8; --line2:#8da1b6;
  --acc:#6a3de8; --acc-soft:#ece6fd; --on-acc:#ffffff;
  --ok:#177a3c; --ok-soft:#dff2e6; --warn:#9a5600; --warn-soft:#fcefd2; --err:#b3261e; --err-soft:#fbe3e0;
  --zone:#eef3f8; --zone-line:#8fa6bd;
  --k-actor:#4b5d73; --k-client:#2c7bbd; --k-server:#244d8f; --k-data:#0d7a84; --k-store:#3c8a4d; --k-queue:#b0702a; --k-ext:#7660ad; --k-mem:#4a8397;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b131c; --surface:#121d2a; --ink:#e6eef6; --muted:#9bb0c3; --line:#26384a; --line2:#56708a;
    --acc:#a98fff; --acc-soft:#2b2254; --on-acc:#140a33;
    --ok:#52c982; --ok-soft:#12301f; --warn:#e8ac45; --warn-soft:#3a2a0d; --err:#ff8077; --err-soft:#3d1a18;
    --zone:#0f1a26; --zone-line:#3d546b;
    --k-actor:#5d738c; --k-client:#2f84c8; --k-server:#3a62a8; --k-data:#139099; --k-store:#46a05a; --k-queue:#c28036; --k-ext:#8a74c4; --k-mem:#5a97ac;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b131c; --surface:#121d2a; --ink:#e6eef6; --muted:#9bb0c3; --line:#26384a; --line2:#56708a;
  --acc:#a98fff; --acc-soft:#2b2254; --on-acc:#140a33;
  --ok:#52c982; --ok-soft:#12301f; --warn:#e8ac45; --warn-soft:#3a2a0d; --err:#ff8077; --err-soft:#3d1a18;
  --zone:#0f1a26; --zone-line:#3d546b;
  --k-actor:#5d738c; --k-client:#2f84c8; --k-server:#3a62a8; --k-data:#139099; --k-store:#46a05a; --k-queue:#c28036; --k-ext:#8a74c4; --k-mem:#5a97ac;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
code{font-family:var(--mono);font-size:.88em;background:var(--acc-soft);color:var(--ink);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:1680px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:14px}
.top h1{margin:0;font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.top p{margin:2px 0 0;color:var(--muted);font-size:14px}
.top p a{color:var(--acc);font-weight:600;text-underline-offset:2px}
.top .acciones{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:8px;font-weight:600;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--acc);color:var(--on-acc)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px;align-items:start}
@media (max-width:1500px){.layout{grid-template-columns:minmax(0,1fr) 310px}}
@media (max-width:1040px){.layout{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.stage-card{padding:10px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:4px 6px 10px}
.toolbar label{font-size:13px;color:var(--muted);font-weight:600}
.toolbar select{border:1px solid var(--line2);background:var(--surface);border-radius:9px;padding:7px 10px;max-width:100%;font-size:14px}
.toolbar .sc-tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.canvas{overflow-x:auto;overflow-y:hidden;border-radius:10px;background:var(--surface)}
.canvas svg{display:block;width:100%;min-width:900px;height:auto}

.legend{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:10px 6px 2px;color:var(--muted);font-size:12.5px}
.legend span{display:inline-flex;gap:7px;align-items:center}
.legend svg{width:34px;height:10px;flex:none}
.legend .n{width:20px;height:20px;border-radius:50%;border:2px solid var(--acc);background:var(--surface);color:var(--ink);font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.fl{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.01em}
.fl.dev{background:var(--warn-soft);color:var(--warn)} .fl.prop{background:var(--acc-soft);color:var(--acc)} .fl.pend{background:var(--line);color:var(--muted)}

.anim-bar{display:flex;flex-direction:column;gap:10px;padding:12px 6px 4px;border-top:1px solid var(--line);margin-top:10px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cbtn{border:1px solid var(--line2);background:var(--surface);border-radius:10px;min-width:42px;height:42px;padding:0 12px;display:inline-flex;gap:7px;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.cbtn svg{width:18px;height:18px;flex:none}
.cbtn:disabled{opacity:.4;cursor:default}
.cbtn.main{background:var(--acc);border-color:var(--acc);color:var(--on-acc);min-width:128px}
.speed{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.seg{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:0 12px;height:40px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc)}
.dots{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line2);background:var(--surface);font-size:11.5px;font-weight:700;padding:0;color:var(--muted)}
.dot.ok{border-color:var(--ok)} .dot.warn{border-color:var(--warn)} .dot.err{border-color:var(--err)}
.dot.past{background:var(--line);color:var(--ink)}
.dot.cur{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}

.estado{display:flex;flex-direction:column;gap:8px;padding:10px 6px 2px;border-top:1px solid var(--line);margin-top:10px}
.estado .fila{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.estado .lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:98px}
.chain{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 4px;align-items:center}
.chain li{font-family:var(--mono);font-size:12px;padding:3px 9px;border-radius:7px;border:1px solid var(--line);color:var(--muted)}
.chain li+li::before{content:"";}
.chain li.seen{color:var(--ink);border-color:var(--line2)}
.chain li.cur{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:700}
.chain li.cur.ok{background:var(--ok);border-color:var(--ok)} .chain li.cur.warn{background:var(--warn);border-color:var(--warn)} .chain li.cur.err{background:var(--err);border-color:var(--err)}
.chain .sep{border:0;padding:0;color:var(--line2)}
.obs{display:flex;flex-wrap:wrap;gap:6px}
.obs span{font-family:var(--mono);font-size:12px;padding:3px 9px;border-radius:7px;background:var(--warn-soft);color:var(--warn)}
.obs em{font-style:normal;color:var(--muted);font-size:13px}
.vis{font-size:13px;color:var(--muted)} .vis b{color:var(--ink)}

.panel{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
@media (min-width:1041px){.panel{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;min-height:24px}
.cnt{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chip{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--acc-soft);color:var(--acc)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.err{background:var(--err-soft);color:var(--err)}
.chip.dev{background:var(--warn-soft);color:var(--warn)} .chip.pend{background:var(--line);color:var(--muted)}
.panel h2{margin:0;font-size:20px;line-height:1.25;font-weight:700;text-wrap:balance}
.panel h3{margin:0 0 3px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.panel p{margin:0}
.simple{font-size:16px;line-height:1.5}
.guarda{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.guarda li{font-size:13px;padding:3px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--surface)}
details.det{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.det summary{cursor:pointer;padding:9px 12px;font-weight:700;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px;border-radius:10px}
details.det summary::-webkit-details-marker{display:none}
details.det summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details.det[open] summary::before{transform:rotate(45deg)}
.tech{padding:2px 12px 12px;font-size:13.5px;line-height:1.55;color:var(--ink)}
.tech ul{margin:0;padding-left:18px} .tech li{margin:3px 0}
.tech p+p{margin-top:8px}
.back{align-self:flex-start;border:1px solid var(--line2);background:var(--surface);border-radius:9px;padding:6px 12px;font-weight:600;font-size:13.5px}
.hint{font-size:12.5px;color:var(--muted)}
[hidden]{display:none!important}

/* ---------- SVG ---------- */
.zona{fill:var(--zone);stroke:var(--zone-line);stroke-width:1.5;stroke-dasharray:7 5}
.zona-t{fill:var(--muted);font:700 13.5px var(--font)}
.edge{fill:none;stroke:var(--line2);stroke-width:1.9;stroke-linejoin:round;marker-end:url(#ah)}
.edge.opt{stroke-dasharray:6 5;marker-end:url(#ah-o)}
.edge.act{stroke:var(--acc);stroke-width:3;marker-end:url(#ah-a)}
.edge.dim,.node.dim,.num.dim{opacity:.22}
#ah path{fill:var(--line2)} #ah-o path{fill:var(--line2)} #ah-a path{fill:var(--acc)}
.node{cursor:pointer}
.node .tile{stroke:none}
.node.k-actor .tile{fill:var(--k-actor)} .node.k-client .tile{fill:var(--k-client)} .node.k-server .tile{fill:var(--k-server)}
.node.k-data .tile{fill:var(--k-data)} .node.k-store .tile{fill:var(--k-store)} .node.k-queue .tile{fill:var(--k-queue)}
.node.k-ext .tile{fill:var(--k-ext)} .node.k-mem .tile{fill:var(--k-mem)}
.node.opt .tile{opacity:.5} .node.opt .odash{display:block}
.odash{display:none;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-dasharray:5 4}
.node .ic{color:#fff;pointer-events:none}
.n-name{fill:var(--ink);font:700 14.5px var(--font);text-anchor:middle}
.n-tag{fill:var(--muted);font:500 12px var(--font);text-anchor:middle}
.node .ring{fill:none;stroke:transparent;stroke-width:3.5}
.node .halo{fill:none;stroke:transparent;stroke-width:3;transform-box:fill-box;transform-origin:center}
.node.r-info .ring{stroke:var(--acc)} .node.r-ok .ring{stroke:var(--ok)} .node.r-warn .ring{stroke:var(--warn)} .node.r-err .ring{stroke:var(--err)}
.node.r-info .halo{stroke:var(--acc);animation:halo 1.3s ease-out 2} .node.r-ok .halo{stroke:var(--ok);animation:halo 1.3s ease-out 2}
.node.r-warn .halo{stroke:var(--warn);animation:halo 1.3s ease-out 2} .node.r-err .halo{stroke:var(--err);animation:halo 1.3s ease-out 2}
@keyframes halo{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.28)}}
.node.sel .ring{stroke:var(--ink);stroke-dasharray:3 4}
.node:focus-visible{outline:none}
.node:focus-visible .ring{stroke:var(--acc);stroke-width:4}
.flag rect{stroke:var(--surface);stroke-width:2}
.flag text{font:700 10.5px var(--font);text-anchor:middle}
.flag.dev rect{fill:var(--warn-soft)} .flag.dev text{fill:var(--warn)}
.flag.prop rect{fill:var(--acc-soft)} .flag.prop text{fill:var(--acc)}
.flag.pend rect{fill:var(--line)} .flag.pend text{fill:var(--muted)}
.badge rect{stroke-width:1.2}
.badge text{font:700 11px var(--mono);text-anchor:middle}
.badge.info rect{fill:var(--acc-soft);stroke:var(--acc)} .badge.info text{fill:var(--acc)}
.badge.ok rect{fill:var(--ok-soft);stroke:var(--ok)} .badge.ok text{fill:var(--ok)}
.badge.warn rect{fill:var(--warn-soft);stroke:var(--warn)} .badge.warn text{fill:var(--warn)}
.badge.err rect{fill:var(--err-soft);stroke:var(--err)} .badge.err text{fill:var(--err)}
.badge.mut rect{fill:var(--line);stroke:var(--line2)} .badge.mut text{fill:var(--muted)}
.v-arq .badge{display:none}
.num circle{fill:var(--surface);stroke:var(--acc);stroke-width:2}
.num .nt{fill:var(--ink);font:700 11.5px var(--font);text-anchor:middle;dominant-baseline:central}
.num.future{opacity:.4}
.num.past circle{fill:var(--line)}
.num.cur circle{fill:var(--acc);stroke:var(--acc)} .num.cur .nt{fill:var(--on-acc)}
.num.cur.ok circle{fill:var(--ok);stroke:var(--ok)} .num.cur.warn circle{fill:var(--warn);stroke:var(--warn)} .num.cur.err circle{fill:var(--err);stroke:var(--err)}
.num.dim{opacity:.15}
.word{fill:var(--muted);font:600 12px var(--font);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.v-anim .word{display:none}
.pq .dotp{fill:var(--acc);stroke:var(--surface);stroke-width:2.5}
.pq .pill{fill:var(--acc)} .pq text{fill:var(--on-acc);font:700 11.5px var(--font);text-anchor:middle}
.pq.ok .dotp,.pq.ok .pill{fill:var(--ok)} .pq.warn .dotp,.pq.warn .pill{fill:var(--warn)} .pq.err .dotp,.pq.err .pill{fill:var(--err)}
.pq.ok text,.pq.warn text,.pq.err text{fill:#fff}
.xmark circle{fill:var(--err);stroke:var(--surface);stroke-width:2.5} .xmark text{fill:#fff;font:700 17px var(--font);text-anchor:middle;dominant-baseline:central}
@media (prefers-reduced-motion:reduce){
  .node .halo{animation:none!important}
  details.det summary::before{transition:none}
}
#errores{margin:0 0 14px;padding:12px 16px;border-radius:12px;background:var(--err-soft);color:var(--err);border:1px solid var(--err);font-size:14px}
#errores ul{margin:6px 0 0;padding-left:20px}
/* ?captura=1: una sola columna, sin controles y sin animaciones de reloj (lo anima el exportador fotograma a fotograma) */
.captura .acciones,.captura .ctrls{display:none}
.captura .layout{grid-template-columns:minmax(0,1fr)}
.captura .panel{position:static;max-height:none}
.captura .toolbar select{pointer-events:none;appearance:none;-webkit-appearance:none}
.captura *{animation:none!important;transition:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="titulo">Diagrama de arquitectura</h1>
      <p id="subtitulo"></p>
    </div>
    <div class="acciones">
      <nav class="tabs" role="tablist" aria-label="Vistas">
        <button role="tab" id="tab-arq" aria-selected="true" aria-controls="stage">Arquitectura</button>
        <button role="tab" id="tab-anim" aria-selected="false" aria-controls="stage">Recorrido animado</button>
      </nav>
      <button class="icon-btn" id="tema" type="button" aria-label="Cambiar entre tema automático, claro y oscuro" title="Tema">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
      </button>
    </div>
  </header>

  <div id="errores" role="alert" hidden></div>

  <main class="layout">
    <section class="card stage-card" id="stage" role="tabpanel">
      <div class="toolbar" id="toolbar" hidden>
        <label for="esc">Escenario</label>
        <select id="esc"></select>
        <span class="sc-tag" id="sc-tag"></span>
      </div>

      <div class="canvas" id="canvas">
        <svg id="svg" role="img"></svg>
      </div>

      <div class="legend" id="legend" aria-label="Leyenda">
        <span><svg viewBox="0 0 34 10" aria-hidden="true"><line x1="0" y1="5" x2="34" y2="5" stroke="var(--line2)" stroke-width="2"/></svg>Funciona</span>
        <span id="lg-opc"><svg viewBox="0 0 34 10" aria-hidden="true"><line x1="0" y1="5" x2="34" y2="5" stroke="var(--line2)" stroke-width="2" stroke-dasharray="6 5"/></svg>Propuesto o pendiente</span>
        <span id="lg-fl"><span class="fl dev" hidden>En desarrollo</span><span class="fl prop" hidden>Propuesto</span><span class="fl pend" hidden>Pendiente</span></span>
        <span><span class="n">1</span><span id="leg-num">Orden del camino normal</span></span>
      </div>

      <div class="anim-bar" id="anim-bar" hidden>
        <div class="ctrls">
          <button class="cbtn" id="b-ini" type="button" aria-label="Volver al primer paso" title="Inicio"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 5h2.4v14H5zM20 5.5v13a.8.8 0 0 1-1.25.66L9.6 12.66a.8.8 0 0 1 0-1.32l9.15-6.5A.8.8 0 0 1 20 5.5z"/></svg></button>
          <button class="cbtn" id="b-ant" type="button" aria-label="Paso anterior" title="Anterior (flecha izquierda)"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 5.5v13a.8.8 0 0 1-1.25.66l-9.15-6.5a.8.8 0 0 1 0-1.32l9.15-6.5a.8.8 0 0 1 1.25.66z"/></svg><span>Anterior</span></button>
          <button class="cbtn main" id="b-play" type="button"><svg id="ico-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.8v14.4a.8.8 0 0 0 1.2.7l12-7.2a.8.8 0 0 0 0-1.4L8.2 4.1A.8.8 0 0 0 7 4.8z"/></svg><span id="t-play">Reproducir</span></button>
          <button class="cbtn" id="b-sig" type="button" aria-label="Paso siguiente" title="Siguiente (flecha derecha)"><span>Siguiente</span><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.5 5.5v13a.8.8 0 0 0 1.25.66l9.15-6.5a.8.8 0 0 0 0-1.32L7.75 4.84A.8.8 0 0 0 6.5 5.5z"/></svg></button>
          <div class="speed"><span id="lbl-vel">Velocidad</span>
            <div class="seg" role="group" aria-labelledby="lbl-vel" id="vel">
              <button type="button" data-v="0.55" aria-pressed="false">Lenta</button>
              <button type="button" data-v="1" aria-pressed="true">Normal</button>
              <button type="button" data-v="2" aria-pressed="false">Rápida</button>
            </div>
          </div>
        </div>
        <ol class="dots" id="dots" aria-label="Pasos del escenario"></ol>
      </div>

      <div class="estado" id="estado" hidden>

/* ======================= Validación de los datos ======================= */
var PAIR={};
function validarGrafo(){
  if(!SPEC.escenarios||!esArr(SPEC.escenarios)||!SPEC.escenarios.length){ERR.push("Falta «escenarios»: debe haber al menos uno.");}
  var ids=Object.keys(NODES);
  if(!ids.length){ERR.push("Falta «nodos».");}
  ids.forEach(function(id){
    var n=NODES[id];
    if(typeof n.x!=="number"||typeof n.y!=="number"){ERR.push("Nodo «"+id+"»: faltan x e y (centro del icono).");}
    if(!ICONS[n.ic]){ERR.push("Nodo «"+id+"»: el icono «"+n.ic+"» no existe. Disponibles: "+Object.keys(ICONS).join(", ")+".");}
    if(KINDS.indexOf(n.k)<0){ERR.push("Nodo «"+id+"»: «k» debe ser uno de "+KINDS.join(", ")+".");}
    if(!n.n||!n.tag){ERR.push("Nodo «"+id+"»: faltan «n» (nombre) o «tag» (subtítulo).");}
    if(!n.simple||!esArr(n.guarda)||!n.tech){ERR.push("Nodo «"+id+"»: faltan «simple», «guarda» (lista) o «tech».");}
    if(n.flag&&(!esArr(n.flag)||FLAGS.indexOf(n.flag[0])<0||!n.flag[1])){ERR.push("Nodo «"+id+"»: «flag» debe ser [\"dev\"|\"prop\"|\"pend\", \"texto\"].");}
  });
  Object.keys(EDGES).forEach(function(id){
    var e=EDGES[id];
    if(!NODES[e.a]||!NODES[e.b]){ERR.push("Flecha «"+id+"»: «a» o «b» no son nodos.");return;}
    if(!esArr(e.pts)||e.pts.length<2||e.pts.some(function(p){return !esArr(p)||p.length!==2||typeof p[0]!=="number"||typeof p[1]!=="number";})){ERR.push("Flecha «"+id+"»: «pts» debe ser una lista de al menos dos puntos [x,y].");return;}
    PAIR[e.a+"|"+e.b]={id:id,rev:false};
    if(!PAIR[e.b+"|"+e.a]){PAIR[e.b+"|"+e.a]={id:id,rev:true};}
  });
  ZONAS.forEach(function(z,i){
    if(typeof z.x!=="number"||typeof z.y!=="number"||typeof z.ancho!=="number"||typeof z.alto!=="number"){ERR.push("Zona "+(i+1)+": faltan x, y, ancho o alto.");}
  });
}
function validarPaso(s,ctx,est){
  if(!esArr(s.path)||!s.path.length){ERR.push(ctx+": «path» debe ser una lista de nodos.");return;}
  s.path.forEach(function(x){if(!NODES[x]){ERR.push(ctx+": el nodo «"+x+"» de «path» no existe.");}});
  for(var i=1;i<s.path.length;i++){
    if(NODES[s.path[i-1]]&&NODES[s.path[i]]&&!PAIR[s.path[i-1]+"|"+s.path[i]]){ERR.push(ctx+": no hay flecha entre «"+s.path[i-1]+"» y «"+s.path[i]+"»; añádela en «flechas» o cambia el camino.");}
  }
  if(!s.t||!s.s||!s.d){ERR.push(ctx+": faltan «t» (título), «s» (en palabras simples) o «d» (detalle técnico).");}
  if(s.k&&KS.indexOf(s.k)<0){ERR.push(ctx+": «k» debe ser ok, warn o err.");}
  if(s.fail&&s.fail!==1&&s.fail!==2){ERR.push(ctx+": «fail» debe ser 1 o 2.");}
  if(s.fail===1&&s.path.length<2){ERR.push(ctx+": «fail»:1 necesita un camino de al menos dos nodos.");}
  if(s.ne&&!EDGES[s.ne]){ERR.push(ctx+": «ne» («"+s.ne+"») no es una flecha.");}
  if(s.wl&&["u","d","l","r"].indexOf(s.wl)<0){ERR.push(ctx+": «wl» debe ser u, d, l o r.");}
  if(s.bad&&!NODES[s.bad]){ERR.push(ctx+": «bad» («"+s.bad+"») no es un nodo.");}
  if(s.set){Object.keys(s.set).forEach(function(n){
    if(!NODES[n]){ERR.push(ctx+": «set» nombra el nodo «"+n+"», que no existe.");}
    else if(!esArr(s.set[n])||typeof s.set[n][0]!=="string"||["info","ok","warn","err","mut"].indexOf(s.set[n][1])<0){ERR.push(ctx+": «set."+n+"» debe ser [\"texto\",\"info|ok|warn|err|mut\"].");}
  });}
  if(s.st){if(!est||!est.claves[s.st]){ERR.push(ctx+": «st» («"+s.st+"») no está en la lista de estados del escenario.");}}
  if(s.obs&&!esArr(s.obs)){ERR.push(ctx+": «obs» debe ser una lista de textos.");}
}
/* Escenarios: un paso puede ser un id de «pasos», {usa:"id", ...cambios} o un paso completo */
var ESC=[];
function resolverEscenarios(){
  (SPEC.escenarios||[]).forEach(function(e,ei){
    var cx="Escenario "+(ei+1)+" («"+(e.n||"sin nombre")+"»)";
    if(!e.n){ERR.push(cx+": falta «n».");}
    if(CS.indexOf(e.c)<0){ERR.push(cx+": «c» debe ser ok, warn, err o prop.");}
    var estSpec=e.estado||SPEC.estado||null,est=null;
    if(estSpec){
      est={titulo:estSpec.titulo||"Estado",lista:estSpec.lista||[],inicial:estSpec.inicial||(estSpec.lista&&estSpec.lista[0]&&estSpec.lista[0][0]),
        alt:typeof estSpec.alt==="number"?estSpec.alt:-1,publico:estSpec.publico||null,publicoTitulo:estSpec.publicoTitulo||"",claves:{}};
      est.lista.forEach(function(x){est.claves[x[0]]=1;});
      if(!est.claves[est.inicial]){ERR.push(cx+": «estado.inicial» no está en «estado.lista».");}
    }
    var ss=[];
    (e.pasos||[]).forEach(function(p,pi){
      var ctx=cx+", paso "+(pi+1),s;
      if(typeof p==="string"){
        if(!PASOS[p]){ERR.push(ctx+": el paso «"+p+"» no existe en «pasos».");return;}
        s=copia(PASOS[p]);
      }else if(p&&p.usa){
        if(!PASOS[p.usa]){ERR.push(ctx+": el paso «"+p.usa+"» no existe en «pasos».");return;}
        s=copia(PASOS[p.usa],p);delete s.usa;
      }else if(p&&p.path){s=copia(p);}
      else{ERR.push(ctx+": no es un id, un {usa} ni un paso con «path».");return;}
      validarPaso(s,ctx,est);
      ss.push(s);
    });
    if(!ss.length){ERR.push(cx+": no tiene pasos.");}
    var ini=typeof e.ini==="number"?e.ini:0;
    if(ini<0||ini>=ss.length){ERR.push(cx+": «ini» fuera de rango.");ini=0;}
    var tieneObs=ss.some(function(s){return s.obs&&s.obs.length;});
    ESC.push({n:e.n,c:e.c,ini:ini,steps:ss,est:est,tieneObs:tieneObs});
  });
}

var ARQ=typeof SPEC.escenarioArquitectura==="number"?SPEC.escenarioArquitectura:0;
if(!ERR.length&&(ARQ<0||ARQ>=ESC.length)){ERR.push("«escenarioArquitectura» fuera de rango.");}

  var box=$("errores");box.hidden=false;box.textContent="";
  box.appendChild(h("b","","El diagrama no se puede dibujar: hay errores en los datos."));

  return;
}

document.title=SPEC.titulo||document.title;
$("titulo").textContent=SPEC.titulo||"Diagrama de arquitectura";

(SPEC.enlaces||[]).forEach(function(l){

  var a=h("a","",l.texto);a.href=l.href;$("subtitulo").appendChild(a);

var svg=$("svg");
svg.setAttribute("viewBox",LZ.x+" "+LZ.y+" "+LZ.ancho+" "+LZ.alto);
svg.style.minWidth=LZ.minAncho+"px";

svg.setAttribute("class","v-arq");
(function(){
  var hayOpt=Object.keys(NODES).some(function(i){return NODES[i].opt;})||Object.keys(EDGES).some(function(i){return EDGES[i].opt;});
  $("lg-opc").hidden=!hayOpt;

/* ======================= Geometría ======================= */
function dist(a,b){return Math.hypot(b[0]-a[0],b[1]-a[1]);}
function polyRoute(pts){
  var cum=[0];for(var i=1;i<pts.length;i++){cum.push(cum[i-1]+dist(pts[i-1],pts[i]));}
  return {pts:pts,cum:cum,total:cum[cum.length-1]};
}
function pointAt(r,d){
  d=Math.max(0,Math.min(r.total,d));
  for(var i=1;i<r.pts.length;i++){
    if(d<=r.cum[i]||i===r.pts.length-1){
      var seg=r.cum[i]-r.cum[i-1],u=seg?(d-r.cum[i-1])/seg:1;
      return {x:r.pts[i-1][0]+(r.pts[i][0]-r.pts[i-1][0])*u,y:r.pts[i-1][1]+(r.pts[i][1]-r.pts[i-1][1])*u,
              dx:r.pts[i][0]-r.pts[i-1][0],dy:r.pts[i][1]-r.pts[i-1][1]};
    }
  }
}
/* Ruta del paquete: une las flechas de los saltos del camino */
function buildRoute(path){
  var pts=[],hops=[];
  for(var i=1;i<path.length;i++){
    var info=PAIR[path[i-1]+"|"+path[i]];
    var p=EDGES[info.id].pts.slice();if(info.rev){p.reverse();}
    hops.push({id:info.id,from:pts.length,to:pts.length+p.length-1});
    pts=pts.concat(p);
  }
  var r=polyRoute(pts);
  hops.forEach(function(hp){hp.d0=r.cum[hp.from];hp.d1=r.cum[hp.to];});
  r.hops=hops;
  return r;
}
function ease(p){return p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;}

}

function dibujarNumeros(){

function cancelar(){gen++;clearTimeout(timer);cancelAnimationFrame(raf);limpiarEscena();}
function seguir(x){
  if(canvas.scrollWidth<=canvas.clientWidth+1){return;}
  var f=svg.getBoundingClientRect().width/LZ.ancho;
  canvas.scrollLeft=(x-LZ.x)*f-canvas.clientWidth/2;

function etiqueta(t,kind){

function mover(r,a,b,ms,mi,fin){
  var t0=performance.now();
  function f(t){
    if(mi!==gen){return;}
    var p=Math.min(1,(t-t0)/ms),d=a+(b-a)*ease(p);
    var pt=pointAt(r,d);
    pq.setAttribute("transform","translate("+pt.x+","+pt.y+")");
    seguir(pt.x);
    if(p<1){raf=requestAnimationFrame(f);}else{fin();}
  }
  raf=requestAnimationFrame(f);
}
function viajar(s,mi,fin){
  var r=buildRoute(s.path),tope=r.total;
  if(s.fail===1){var hp=r.hops[r.hops.length-1];tope=hp.d0+(hp.d1-hp.d0)*.55;}
  var ms=Math.min(2800,650+tope*1.9)/speed;
  etiqueta(s.w||"",s.k==="err"?"err":s.k==="warn"?"warn":"");
  pq.setAttribute("visibility","visible");
  var p0=pointAt(r,0);pq.setAttribute("transform","translate("+p0.x+","+p0.y+")");
  mover(r,0,tope,ms,mi,function(){
    if(s.rt&&!s.fail){
      timer=setTimeout(function(){
        if(mi!==gen){return;}
        etiqueta(s.rt,"ok");
        mover(r,tope,0,ms*.7,mi,function(){pq.setAttribute("visibility","hidden");fin();});
      },260/speed);
    }else{
      pq.setAttribute("visibility","hidden");fin();
    }
  });
}
function posFallo(s){
  if(s.fail===1){
    var r=buildRoute(s.path),hp=r.hops[r.hops.length-1],p=pointAt(r,hp.d0+(hp.d1-hp.d0)*.55);
    return {x:p.x,y:p.y};
  }
  var n=NODES[s.bad||s.path[s.path.length-1]];
  return {x:n.x+30,y:n.y-30};
}
function llegada(i){
  var s=steps()[i];
  var c=pintarInsignias(i);
  pintarEstado(i);pintarNumeros(i);
  limpiarEscena();
  for(var j=1;j<s.path.length;j++){edgeEl[PAIR[s.path[j-1]+"|"+s.path[j]].id].classList.add("act");}
  var fin=s.bad||s.path[s.path.length-1];
  var kind=s.k||"info";
  nodeEl[fin].classList.add("r-"+kind);
  if(s.fail){var p=posFallo(s);xm.setAttribute("transform","translate("+p.x+","+p.y+")");xm.setAttribute("visibility","visible");}
  seguir(NODES[fin].x);
  actualizarControles();
  return c;
}
function mostrar(i,animar,cb){
  cancelar();var mi=gen;
  idx=i;quitarSeleccion();
  panelPaso(i);
  var s=steps()[i];
  actualizarControles();
  if(!animar||reduce){llegada(i);if(cb){cb();}return;}
  pintarInsignias(i-1);pintarEstado(i-1);pintarNumeros(i);
  for(var j=1;j<s.path.length;j++){edgeEl[PAIR[s.path[j-1]+"|"+s.path[j]].id].classList.add("act");}
  function fin(){if(mi!==gen){return;}llegada(i);if(cb){cb();}}
  if(s.path.length>1){viajar(s,mi,fin);}
  else{timer=setTimeout(fin,450/speed);}
}
function programar(){
  if(!playing){return;}
  if(idx>=steps().length-1){playing=false;actualizarControles();return;}
  var mi=gen;
  clearTimeout(timer);
  timer=setTimeout(function(){
    if(playing&&mi===gen){mostrar(idx+1,true,programar);}
  },(1500+steps()[idx].s.length*13)/speed);
}
function reproducir(){
  if(playing){playing=false;clearTimeout(timer);actualizarControles();return;}
  playing=true;
  if(idx>=steps().length-1){mostrar(0,true,programar);}
  else{actualizarControles();programar();}
}
function ir(i){
  playing=false;
  mostrar(Math.max(0,Math.min(steps().length-1,i)),true);
}

  $("leg-num").textContent="Orden del paso (los claros aún no ocurren)";
  playing=autoplay&&!reduce;
  mostrar(typeof paso==="number"?paso:ESC[i].ini,false,programar);
}
function cambiarVista(v,paso){
  vista=v;
  var an=v==="anim";
  $("tab-arq").setAttribute("aria-selected",an?"false":"true");
  $("tab-anim").setAttribute("aria-selected",an?"true":"false");
  $("toolbar").hidden=!an;$("anim-bar").hidden=!an;
  svg.setAttribute("class",an?"v-anim":"v-arq");
  cancelar();quitarSeleccion();playing=false;
  if(an){
    elegirEscenario(esc,!CAPTURA,paso);
  }else{
    filasEstado();
    Object.keys(badgeEl).forEach(function(id){badgeEl[id].g.setAttribute("visibility","hidden");});
    $("leg-num").textContent="Orden de «"+ESC[ARQ].n+"»";
    dibujarNumeros();pintarAtenuado();pintarNumeros(-1);
    panelResumen();
  }
  try{history.replaceState(null,"",location.search+"#"+(an?"recorrido":"arquitectura"));}catch(e){}
}

/* ======================= Tema ======================= */
var TEMAS=["auto","light","dark"],temaIdx=0;
(function(){
  var q=(Q.tema||"").toLowerCase();
  if(q==="claro"||q==="light"){temaIdx=1;}
  else if(q==="oscuro"||q==="dark"){temaIdx=2;}
  else{try{var t=localStorage.getItem("diagrama-tema");if(t&&TEMAS.indexOf(t)>=0){temaIdx=TEMAS.indexOf(t);}}catch(e){}}
  aplicarTema();
})();
function aplicarTema(){
  var t=TEMAS[temaIdx];
  if(t==="auto"){document.documentElement.removeAttribute("data-theme");}else{document.documentElement.setAttribute("data-theme",t);}
  var nombre={auto:"automático",light:"claro",dark:"oscuro"}[t];
  $("tema").title="Tema: "+nombre;$("tema").setAttribute("aria-label","Cambiar tema (ahora: "+nombre+")");
}

/* ======================= Eventos ======================= */
$("tab-arq").addEventListener("click",function(){cambiarVista("arq");});
$("tab-anim").addEventListener("click",function(){cambiarVista("anim");});
$("esc").addEventListener("change",function(){elegirEscenario(parseInt(this.value,10),true);});
$("b-play").addEventListener("click",reproducir);
$("b-sig").addEventListener("click",function(){ir(idx+1);});
$("b-ant").addEventListener("click",function(){ir(idx-1);});
$("b-ini").addEventListener("click",function(){ir(0);});
$("vel").addEventListener("click",function(ev){
  var b=ev.target.closest("button");if(!b){return;}
  speed=parseFloat(b.dataset.v)||1;
  Array.prototype.forEach.call($("vel").children,function(x){x.setAttribute("aria-pressed",x===b?"true":"false");});
});
$("p-back").addEventListener("click",function(){quitarSeleccion();panelPaso(idx);});
$("tema").addEventListener("click",function(){
  temaIdx=(temaIdx+1)%TEMAS.length;aplicarTema();
  try{localStorage.setItem("diagrama-tema",TEMAS[temaIdx]);}catch(e){}
});
document.addEventListener("keydown",function(ev){
  if(vista!=="anim"||ev.altKey||ev.ctrlKey||ev.metaKey){return;}
  var t=ev.target&&ev.target.tagName;
  if(t==="SELECT"||t==="INPUT"||t==="TEXTAREA"||t==="SUMMARY"){return;}
  if(ev.key==="ArrowRight"){ev.preventDefault();ir(idx+1);}
  else if(ev.key==="ArrowLeft"){ev.preventDefault();ir(idx-1);}
});

/* ======================= Inicio ======================= */
/* ?vista=arquitectura|recorrido (o #recorrido), ?escenario=N y ?paso=K (desde 1), ?captura=1, ?tema=claro|oscuro */
construirSelector();
(function(){
  var an=Q.vista==="recorrido"||(!Q.vista&&location.hash==="#recorrido");
  var e=parseInt(Q.escenario,10),p=parseInt(Q.paso,10);
  if(e>=1&&e<=ESC.length){esc=e-1;}
  var paso=(p>=1&&p<=ESC[esc].steps.length)?p-1:undefined;
  cambiarVista(an?"anim":"arq",paso);
})();
})();
</script>
